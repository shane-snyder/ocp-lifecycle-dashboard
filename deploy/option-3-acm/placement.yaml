# Where the policy goes: every OpenShift cluster in the `global` set (all
# managed clusters, including the hub's local-cluster). Narrow it with a
# label, e.g. add `{ key: ocp-lifecycle, operator: In, values: ["true"] }`
# and `oc label managedcluster <name> ocp-lifecycle=true`.
apiVersion: v1
kind: Namespace
metadata:
  name: ocp-lifecycle-policies
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: ocp-lifecycle-policies
spec:
  clusterSet: global
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: ocp-lifecycle-exporter
  namespace: ocp-lifecycle-policies
spec:
  clusterSets: [global]
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - { key: vendor, operator: In, values: [OpenShift] }
  tolerations:
    - { key: cluster.open-cluster-management.io/unreachable, operator: Exists }
    - { key: cluster.open-cluster-management.io/unavailable, operator: Exists }
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ocp-lifecycle-exporter
  namespace: ocp-lifecycle-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: ocp-lifecycle-exporter
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: ocp-lifecycle-exporter
