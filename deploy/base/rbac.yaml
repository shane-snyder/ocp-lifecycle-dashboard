apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-lifecycle-exporter
  namespace: ocp-lifecycle
---
# Read-only: the cluster version, every Subscription, and the CSVs they
# installed (for the exact operator version).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-lifecycle-exporter
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocp-lifecycle-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ocp-lifecycle-exporter
subjects:
  - kind: ServiceAccount
    name: ocp-lifecycle-exporter
    namespace: ocp-lifecycle
