# Grafana managed by the Grafana Operator: a data source on your metrics
# backend and the dashboard.
#
#   oc apply -k deploy/option-2-opentelemetry/grafana-operator
#
# Set `namespace` to your Grafana's namespace and, if your Grafana CR is not
# labelled dashboards=grafana, change the instanceSelector patch below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
  - datasource.yaml
  - grafana-dashboard.yaml

patches:
  - target:
      group: grafana.integreatly.org
    patch: |-
      - op: replace
        path: /spec/instanceSelector
        value:
          matchLabels:
            dashboards: grafana
