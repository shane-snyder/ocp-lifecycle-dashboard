# Scrapes the exporter and forwards its series to your metrics backend. Needs
# the Red Hat build of OpenTelemetry operator.
#
# The cluster is identified the OpenTelemetry way: resource detection sets
# k8s.cluster.name, which Prometheus-style backends expose as the
# k8s_cluster_name label that dashboards/ocp-lifecycle-otel.json selects on.
# Edit the backend endpoint marked CHANGE ME.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ocp-lifecycle
  namespace: ocp-lifecycle
spec:
  mode: deployment
  replicas: 1
  serviceAccount: ocp-lifecycle-collector
  env:
    # Optional: a friendlier name than the infrastructure ID the openshift
    # detector reports (e.g. mycluster-x7k2p). The env detector runs first and wins.
    # - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.cluster.name=prod-east" }
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: ocp-lifecycle-exporter
              scrape_interval: 2m
              scrape_timeout: 30s
              static_configs:
                - targets: ["ocp-lifecycle-exporter.ocp-lifecycle.svc:9120"]

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      # k8s.cluster.name: OTEL_RESOURCE_ATTRIBUTES if set, otherwise the
      # cluster's infrastructure name.
      resourcedetection:
        detectors: [env, openshift]
        override: false
        timeout: 5s
      # Most backends keep resource attributes out of series labels unless told
      # to promote them (Prometheus: otlp.promote_resource_attributes, Mimir:
      # promote_otel_resource_attributes). If yours can't, copy it onto every
      # data point instead by adding transform/cluster to the pipeline. Don't do
      # both: a backend that also promotes it would see the label twice.
      transform/cluster:
        metric_statements:
          - context: datapoint
            statements:
              - set(datapoint.attributes["k8s.cluster.name"], resource.attributes["k8s.cluster.name"])
      batch: {}

    exporters:
      # OTLP over HTTP, accepted by Prometheus 3 (--web.enable-otlp-receiver),
      # Mimir, Thanos Receive, Grafana Cloud and most other backends.
      # CHANGE ME: the endpoint (the collector appends /v1/metrics).
      otlphttp:
        endpoint: https://metrics.example.com/otlp
        # headers:
        #   Authorization: "Bearer ${env:BACKEND_TOKEN}"
        #   X-Scope-OrgID: my-tenant
      # Or Prometheus remote write; swap it into the pipeline below.
      # prometheusremotewrite:
      #   endpoint: https://metrics.example.com/api/v1/push

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp]
