name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      # Dashboards, ACM policies and allowlist are generated; fail if a
      # source changed without regenerating them. (kubectl is preinstalled.)
      - run: python hack/generate.py --check
      - name: Build every kustomization
        run: |
          for k in $(find deploy -name kustomization.yaml -not -path '*/components/*'); do
            echo "::group::$(dirname "$k")"
            kubectl kustomize "$(dirname "$k")" > /dev/null
            echo "::endgroup::"
          done
