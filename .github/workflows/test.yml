name: Test

# Images are built in-cluster and pushed to the homelab Quay
# (ocp-homelab: components/ocp-lifecycle-exporter-pipeline). This only runs the
# unit tests so PRs get a signal.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
